# Winona segment (docs/research/mask-designs.md, "Kumoryu 的 Brief", option B; provisional, David
# 2026-11-21): a dragon riding a big cumulus cloud, a black-bearded dragon mask (kurohige, imagery
# only, not a deity) at its centre, gold horns, cloud puffs bulging out like wings, a scaled tail
# curling out behind. Replaces Altaria (Winona's ace). Stats and abilities follow Altaria.

