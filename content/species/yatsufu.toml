# Winona segment (docs/research/mask-designs.md, "Yatsufu 的 Brief", option A; provisional, David
# 2026-11-21): a long-necked grass beast with two huge yatsude leaves on its back (the tengu's
# feather fan), a shimenawa round its neck and dried persimmons hanging under its chin. Replaces
# Tropius (Route 119 wild, Winona's team). Stats and abilities follow Tropius.

