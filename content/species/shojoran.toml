# Mossdeep segment (docs/research/mask-designs.md, "Shojoran", option A; approved by the user 2026-11-22):
# the shojo dancing "midare", the wild tiptoe dance on the waves in the Noh play Shojo, in a great sake
# cup with a long ladle. Shojomai's evolution (Water Stone, like Lombre -> Ludicolo); replaces Ludicolo
# (the Lilycove rival). Stats and abilities follow Ludicolo.

id = "SHOJORAN"
name = "Shojoran"
category = "Wave Dance"

types = ["WATER", "FAIRY"]
abilities = ["SWIFT_SWIM", "RAIN_DISH", "OWN_TEMPO"]   # [slot 1, slot 2, hidden]
base_stats = { hp = 80, atk = 70, def = 70, spa = 90, spd = 100, spe = 70 }   # total 480
ev_yield = { spd = 3 }
catch_rate = 45
exp_yield = 240
gender = 50.0
egg_cycles = 20
egg_groups = ["WATER_1", "FAIRY"]
growth_rate = "MEDIUM_SLOW"
body_color = "RED"
cry = "NONE"
evolutions = []   # [{ method, param, into }]

[dex]
height = 15
weight = 550
text = """
When the moon is on the water it floats
out in a great cup and dances on the
tips of its toes, hair flying. The
sake in its ladle never runs dry."""
