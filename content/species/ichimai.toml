# Winona segment (docs/research/mask-designs.md, "留給之後的 Brief:盤子怨靈 Ichimai", option A): the plate-
# counting well ghost after the public-domain Okiku of Bancho Sarayashiki (not Sadako, a copyrighted
# character). A rare wild encounter on Route 120 (Lv25-30); from the Mossdeep segment it also replaces
# Duskull on Mt. Pyre (replacements.toml).
# Stats between Shuppet (295) and Banette (455), special-leaning.

id = "ICHIMAI"
name = "Ichimai"
category = "Plate Ghost"

types = ["GHOST", "WATER"]
abilities = ["CURSED_BODY", "NONE", "FRISK"]   # [slot 1, slot 2, hidden]
base_stats = { hp = 60, atk = 55, def = 55, spa = 95, spd = 75, spe = 60 }   # total 400
ev_yield = { spa = 2 }
catch_rate = 45
exp_yield = 140
gender = 100.0
egg_cycles = 25
egg_groups = ["AMORPHOUS"]
growth_rate = "FAST"
body_color = "WHITE"
cry = "NONE"
evolutions = []   # [{ method, param, into }]

[dex]
height = 15
weight = 300
text = """
It climbs out of an old well at night and
counts its plates: one, two... At nine it
breaks into sobs, for one is always lost.
Never answer it with the number ten."""
scale = { pokemon = 541, pokemon_offset = 19, trainer = 256, trainer_offset = 0 }

[learnset]
level = [
    [1, "ASTONISH"], [1, "WATER_GUN"], [6, "FAKE_TEARS"], [10, "NIGHT_SHADE"], [14, "SPITE"], [19, "HEX"], [23, "WATER_PULSE"], [28, "CURSE"], [32, "SHADOW_BALL"], [37, "GRUDGE"], [41, "MUDDY_WATER"], [46, "PERISH_SONG"],
]
# Surf and Dive of its own (a spirit of the well and the water), and Flash from Duskull, the vanilla
# species it replaces on Mt. Pyre. No Cut, Strength or Rock Smash (no strength in its drowned arms).
# HMs follow the vanilla species it replaces (content/replacements.toml), except: no STRENGTH, ROCK_SMASH (Dusclops brings them; a stack of plates pushes and breaks nothing).
teachable = [
    "ATTRACT", "BLIZZARD", "BODY_SLAM", "CALM_MIND", "DIVE", "DREAM_EATER", "ENDURE", "FACADE", "FLASH", "FRUSTRATION", "HAIL", "HIDDEN_POWER", "HYPER_BEAM", "ICE_BEAM", "PROTECT", "PSYCHIC", "RAIN_DANCE", "REST", "RETURN", "SECRET_POWER", "SHADOW_BALL", "SHOCK_WAVE", "SLEEP_TALK", "SNORE", "SUBSTITUTE", "SUNNY_DAY", "SURF", "SWAGGER", "SWORDS_DANCE", "THIEF", "THUNDER", "THUNDERBOLT", "THUNDER_WAVE", "TOXIC", "WATER_PULSE"
]
egg = []


[graphics]
dir = "graphics/pokemon/oddex/ichimai"   # rendered by tools/oddex/blender/make_art.py
front_anim = "V_SQUISH_AND_BOUNCE"
front_frames = [[0, 6], [1, 15], [0, 6], [1, 15], [0, 3]]
back_anim = "CONCAVE_ARC_LARGE"
jump = "SLOW"
shadow = { x = 0, y = 4, size = "M" }
overworld = { size = "32x32", shadow = "M", tracks = "NONE" }

[design]
habitat = ["Route120"]
level_band = [25, 30]
family = ["ICHIMAI"]
