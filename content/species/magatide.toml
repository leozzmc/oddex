# Rustboro batch (see docs/research/mask-designs.md): fused mask parts plus Shinto / Vajrayana / Shingon
# imagery, never a deity. Replaces Magikarp (Route 104 fishers) and Marill (Route 104 wild). Stats and moves are provisional.

id = "MAGATIDE"
name = "Magatide"
category = "Jewel Fish"

types = ["WATER", "DRAGON"]
abilities = ["SWIFT_SWIM", "NONE", "RATTLED"]   # [slot 1, slot 2, hidden]
base_stats = { hp = 40, atk = 20, def = 55, spa = 35, spd = 55, spe = 50 }   # total 255
ev_yield = { spd = 1 }
catch_rate = 190
exp_yield = 51
gender = 50.0
