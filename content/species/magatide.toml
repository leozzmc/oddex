    [1, "SPLASH"], [1, "WATER_GUN"], [5, "TWISTER"], [10, "BUBBLE_BEAM"], [15, "DRAGON_BREATH"], [20, "AQUA_TAIL"], [25, "DRAGON_PULSE"],
]
