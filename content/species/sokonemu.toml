# Sootopolis segment (docs/research/mask-designs.md, "海底:Sokonemu"): the Kyogre slot (role LEGEND_SEA).
# After the stone idol in H. P. Lovecraft's "The Call of Cthulhu" (1928, public domain). Stats and ability follow
# Kyogre (Drizzle drives the story's rain); moves are provisional.

