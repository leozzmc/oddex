    "BODY_SLAM", "BRICK_BREAK", "BULK_UP", "DIG", "DOUBLE_TEAM", "EARTHQUAKE", "ENDURE", "FACADE", "FOCUS_PUNCH", "FRUSTRATION", "GIGA_DRAIN", "HIDDEN_POWER", "HYPER_BEAM", "PROTECT", "REST", "RETURN", "ROAR", "ROCK_SLIDE", "ROCK_SMASH", "ROCK_TOMB", "SAFEGUARD", "SANDSTORM", "SECRET_POWER", "SHADOW_BALL", "SLEEP_TALK", "SNORE", "SOLAR_BEAM", "STRENGTH", "SUBSTITUTE", "SUNNY_DAY", "SWAGGER", "TOXIC",
