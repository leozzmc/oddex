# Vanilla -> oddex species, applied in place to trainers.party and wild_encounters.json by
# tools/oddex/apply_replacements.py (e.g. --scope early). One key per vanilla evolution stage;
# the value is an id from content/species/*.toml at the same stage (checked with
# species_data.vanilla_stages / oddex_stages). See docs/research/mask-designs.md for why each
# mask fills its slot.
#
# Rules for stages we do not have yet: only the Omotelle and Usobuzz lines have more than one stage
# today, so most vanilla stage 2/3 species (Mightyena, Linoone, Beautifly/Dustox, Pelipper,
# Lombre/Ludicolo, Nuzleaf/Shiftry, Breloom, Swellow, the starters' evolutions) are deliberately
# absent. apply_replacements lists them as missing instead of guessing. Add each when its line gets
# an evolution. A stage-2 vanilla species may map onto a stage-1 original only when its stage-1
# form never appears in the game segment that uses it; each such key is in stage_mismatch_ok with
# the reason next to it.

stage_mismatch_ok = [
    "MARILL",    # Route 104 wild; Azurill (its stage 1) is never met in the Rustboro segment
    "PIKACHU",   # only the Rustboro house pet (role RUSTBORO_PET); Pichu never appears
    # Lavaridge segment (mask-designs.md, "Lavaridge 段"):
    "NINJASK",   # stage 2 onto stage-1 Torobi; Nincada never appears in the segment
    "ROSELIA",   # stage 2 (after Budew) onto single-stage Higanmen; Budew never appears
    "ZANGOOSE",  # single-stage, strong (458): onto stage-2 Kyozosu (420), one trainer only
    "KECLEON",   # single-stage (440): onto stage-2 Kyozosu, the fox in disguise for the camouflager
    "SKARMORY",  # single-stage, strong (465): onto stage-3 Daibeki (480), the steel great tengu
    "AZUMARILL", # stage 3, graphics only (Route 117 day care yard); Magatide as for Marill
    # Norman segment:
    "WIGGLYTUFF",  # stage 3 onto stage-2 Kyozosu; Igglybuff and Jigglypuff never appear in the segment
    # Winona segment (mask-designs.md "Winona 段"): the closest creature by type and total wins over
    # the stage, since these lines have no matching stage among the originals.
    "KADABRA",     # stage 2 onto single-stage Tsukuyume, Abra's creature (the Abra line stays one creature)
    "MACHOKE",     # stage 2 onto stage-3 Yokozunat (395 vs 405); Karuvajra (Machop) has no stage 2
    "HARIYAMA",    # stage 2 onto stage-3 Yokozunat, the sumo champion
    "GLOOM",       # stage 2 onto single-stage Higanmen (400 vs 395), Roselia's creature
    "BRELOOM",     # stage 2 onto stage-3 Daibeki (480 vs 460); Yamambrr (Shroomish) has no stage 2
    "TENTACRUEL",  # stage 2 onto single-stage Jatai (458 vs 515); Shojomai (340) is too weak for its trainers
    "JIGGLYPUFF",  # stage 2 onto stage-1 Kyokon; Igglybuff never appears, Wigglytuff is Kyozosu
    "ABSOL",       # single-stage (465) onto stage-2 Raijuoh (475), the dark beast
    "ALTARIA",     # stage 2 onto single-stage Kumoryu: Winona's ace gets its own creature; Swablu stays Utoghast
    # Mossdeep segment (mask-designs.md "Mossdeep 段"):
    "CROBAT",      # stage 3 onto stage-2 Nobusumen (480 vs 535): one evolution covers Golbat and Crobat
    "GIRAFARIG",   # single-stage (455) onto stage-2 Kyozosu (420)
    "GYARADOS",    # stage 2 onto single-stage Kumoryu (490 vs 540): the carp that became a dragon
    "MAWILE",      # single-stage (380) onto stage-2 Karabeki (340), steel
    "PINSIR",      # single-stage (500) onto stage-3 Yokozunat (395), bug
    "HERACROSS",   # single-stage (500) onto stage-3 Yokozunat (395), bug/fighting like it (Safari Zone)
    "WOBBUFFET",   # stage 2 onto single-stage Tomoeden (405 = 405); Gachirinza (Wynaut) would be -31%
    "LUVDISC",     # single-stage (330) onto stage-2 Shojomai (340), Route 125
    "SEAKING",     # stage 2 onto stage-1 Kamorai (310 vs 450), Goldeen's creature; the line has no stage 2
    # Sootopolis segment (mask-designs.md "Sootopolis 段"):
    "CRAWDAUNT",   # stage 2 onto a single-stage creature: Jatai for Juan (applied in [sootopolis]), Umibozu from the League on
    "WAILORD",     # stage 2 onto single-stage Kumoryu (490 vs 500): one wild slot on Route 129; Kamorai has no stage 2
    "MEDICHAM",    # stage 2 onto stage-3 Yokozunat (395 vs 410): one trainer; Gachirinza (Meditite) would be -32%
    "KINGDRA",     # stage 3 onto stage-2 Magaryu (500 vs 540): one evolution covers Seadra and Kingdra
    # League segment (mask-designs.md "League 段"):
    "SABLEYE",     # single-stage (380) onto stage-2 Kyozosu (420): Phoebe's Lv50 slot; Kyokon (240) was -37%
    "TORKOAL",     # single-stage (470) onto stage-2 Kamadoro (460); Shishiblaze (310) was -34%
    "DUSCLOPS",    # stage 2 onto single-stage Ichimai (400 vs 455), Duskull's creature
    "CACTURNE",    # stage 2 onto single-stage Waraningyo (475 = 475); Cacnea stays Okinoir
    "GLALIE",      # stage 2 onto single-stage Yukijoro (500 vs 480)
    "WALREIN",     # stage 3 onto single-stage Yukijoro (500 vs 530): one creature covers Glacia's two lines' tops
    "MILOTIC",     # stage 2 onto single-stage Ningyomen (540 = 540); Feebas stays the FISHING_SPOT role
]

