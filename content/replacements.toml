# Vanilla -> oddex species, applied in place to trainers.party and wild_encounters.json by
# tools/oddex/apply_replacements.py (e.g. --scope early). One key per vanilla evolution stage;
# the value is an id from content/species/*.toml at the same stage (checked with
# species_data.vanilla_stages / oddex_stages). See docs/research/mask-designs.md for why each
# mask fills its slot.
#
# Rules for stages we do not have yet: only the Omotelle and Usobuzz lines have more than one stage
# today, so most vanilla stage 2/3 species (Mightyena, Linoone, Beautifly/Dustox, Pelipper,
# Lombre/Ludicolo, Nuzleaf/Shiftry, Breloom, Swellow, the starters' evolutions) are deliberately
# absent. apply_replacements lists them as missing instead of guessing. Add each when its line gets
# an evolution. A stage-2 vanilla species may map onto a stage-1 original only when its stage-1
# form never appears in the game segment that uses it; each such key is in stage_mismatch_ok with
# the reason next to it.

stage_mismatch_ok = [
    "MARILL",    # Route 104 wild; Azurill (its stage 1) is never met in the Rustboro segment
    "PIKACHU",   # only the Rustboro house pet (role RUSTBORO_PET); Pichu never appears
    # Lavaridge segment (mask-designs.md, "Lavaridge 段"):
    "NINJASK",   # stage 2 onto stage-1 Torobi; Nincada never appears in the segment
    "ROSELIA",   # stage 2 (after Budew) onto single-stage Higanmen; Budew never appears
    "ZANGOOSE",  # single-stage, strong (458): onto stage-2 Kyozosu (420), one trainer only
    "KECLEON",   # single-stage (440): onto stage-2 Kyozosu, the fox in disguise for the camouflager
    "SKARMORY",  # single-stage, strong (465): onto stage-3 Daibeki (480), the steel great tengu
    "AZUMARILL", # stage 3, graphics only (Route 117 day care yard); Magatide as for Marill
    # Norman segment:
    "WIGGLYTUFF",  # stage 3 onto stage-2 Kyozosu; Igglybuff and Jigglypuff never appear in the segment
]

