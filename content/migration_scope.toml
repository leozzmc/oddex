# Plan B migration scopes: which content has moved (or is moving) from vanilla to original species.
# Shared by tools/oddex/apply_replacements.py (--scope NAME: what to rewrite) and
# tools/oddex/check_species_refs.py (--scope NAME: what to report; --strict-scopes: fail on every
# scope with strict = true). `make check-oddex` runs --strict-scopes, so this file is also the
# migration progress table: flip `strict` to true once a scope is migrated.
#
# Fields (all optional):
#   wild_maps     map names (map.json "name") whose wild encounter tables are in scope;
#                 "Map:kind" takes just that table, whatever wild_kinds says
#   wild_kinds    encounter tables to include, e.g. ["land_mons"] (default: all kinds)
#   trainers      explicit TRAINER_* constants; trainers are never inferred from maps
#   maps          map names for scripts, text and Pokemon-shaped map objects; shell-style
#                 wildcards allowed ("LittlerootTown*" includes the town's interiors)
#   exclude_maps  map names/wildcards removed from `maps`
#   exclude_refs  "<file relative to game/>:SPECIES_X" pairs that stay out of scope
#   c_files       C sources (relative to game/) whose species references must all be migrated
#   script_files  shared event scripts (game/data/scripts/*.inc) used by this stretch; their script
#                 and text references count as in scope (map scripts are covered by `maps`)

[early]
description = "Littleroot -> Petalburg: plan B step 4b"
strict = true
wild_maps = ["Route101", "Route102", "Route103"]
wild_kinds = ["land_mons"]   # water and fishing need a rod or Surf; not reachable this early
trainers = [
    # Route 102. Route 103's other trainers are mid-game (reached from Route 110 or by Surf).
    "TRAINER_CALVIN_1", "TRAINER_RICK", "TRAINER_TIANA", "TRAINER_ALLEN",
    # Route 103 rival; already role aliases (Oddex Starter *) since step 2b.
    "TRAINER_MAY_ROUTE_103_TREECKO", "TRAINER_MAY_ROUTE_103_TORCHIC", "TRAINER_MAY_ROUTE_103_MUDKIP",
    "TRAINER_BRENDAN_ROUTE_103_TREECKO", "TRAINER_BRENDAN_ROUTE_103_TORCHIC", "TRAINER_BRENDAN_ROUTE_103_MUDKIP",
]
maps = ["LittlerootTown*", "Route101", "OldaleTown*", "Route103", "Route102", "PetalburgCity*"]
exclude_refs = [
    # Birch gives a Johto starter after the Hall of Fame; post-game, not part of this scope.
    "data/maps/LittlerootTown_ProfessorBirchsLab/scripts.inc:SPECIES_CHIKORITA",
    "data/maps/LittlerootTown_ProfessorBirchsLab/scripts.inc:SPECIES_CYNDAQUIL",
    "data/maps/LittlerootTown_ProfessorBirchsLab/scripts.inc:SPECIES_TOTODILE",
]
# The story Pokemon of this stretch (intro, rescue, starters, Wally's tutorial) are role aliases
# since steps 2a/2b, so no C file has to be listed here.
c_files = []
# Both Littleroot houses run the shared players' house scripts (movers, Mom, TV).
script_files = ["data/scripts/players_house.inc"]

[rustboro]
description = "Petalburg -> Route 104 -> Petalburg Woods -> Rustboro, up to Roxanne (first badge)"
strict = true
# Route 104 water and fishing need Surf or a rod (the Old Rod comes in Dewford). Route 116 is open
# before the first badge and to_rustboro trains there, so its land table is in scope.
wild_maps = ["Route104", "PetalburgWoods", "Route116"]
wild_kinds = ["land_mons"]
# Checked by land reachability from Petalburg without Surf, Cut, Rock Smash or Strength.
trainers = [
    "TRAINER_HALEY_1", "TRAINER_IVAN", "TRAINER_GINA_AND_MIA_1", "TRAINER_WINSTON_1",
    "TRAINER_CINDY_1", "TRAINER_BILLY", "TRAINER_DARIAN",
    "TRAINER_LYLE", "TRAINER_JAMES_1", "TRAINER_GRUNT_PETALBURG_WOODS",
    # Route 116 west of the Cut trees and ledges; Janice, Jerry, Sarah and Dawson need Cut.
    "TRAINER_JOEY", "TRAINER_JOSE", "TRAINER_CLARK", "TRAINER_KAREN_1", "TRAINER_JOHNSON", "TRAINER_DEVAN",
    "TRAINER_JOSH", "TRAINER_TOMMY", "TRAINER_MARC", "TRAINER_ROXANNE_1",
    # The Route 104 rival (TRAINER_{MAY,BRENDAN}_RUSTBORO_*) comes after the Devon Goods errand: next scope.
]
maps = ["Route104*", "PetalburgWoods", "RustboroCity*", "Route116"]
exclude_refs = [
    # Devon revives Lileep/Anorith from fossils found in the desert (Route 111): much later.
    "data/maps/RustboroCity_DevonCorp_2F/scripts.inc:SPECIES_LILEEP",
    "data/maps/RustboroCity_DevonCorp_2F/scripts.inc:SPECIES_ANORITH",
]
c_files = []

[dewford]
description = "Devon Goods (Rusturf Tunnel), Route 104 rival, Mr. Briney to Dewford, Brawly, Granite Cave"
strict = true
# Checked with stage_reach.py from Rustboro and from Dewford (Briney's boat), without Surf, Cut,
# Rock Smash or Strength. The Old Rod comes from the Dewford fisherman, so fishing is in scope on
# the maps Briney connects (Dewford, Route 104, 106, 107); fishing_mons also holds the Good/Super
# Rod slots, which are migrated early with it. Route 104's land table is already in [rustboro]
# (listing the map here just means both scopes cover it).
wild_maps = ["RusturfTunnel", "GraniteCave_1F", "GraniteCave_B1F", "GraniteCave_B2F", "GraniteCave_StevensRoom",
             "Route104", "Route106", "Route107", "DewfordTown"]
wild_kinds = ["land_mons", "fishing_mons"]   # Granite Cave rock_smash_mons needs Rock Smash
trainers = [
    # Aqua grunt with the Devon Goods (Mike in the tunnel needs Rock Smash).
    "TRAINER_GRUNT_RUSTURF_TUNNEL",
    # Route 104 rival after the Devon errand (all six starter/gender variants).
    "TRAINER_MAY_RUSTBORO_TREECKO", "TRAINER_MAY_RUSTBORO_TORCHIC", "TRAINER_MAY_RUSTBORO_MUDKIP",
    "TRAINER_BRENDAN_RUSTBORO_TREECKO", "TRAINER_BRENDAN_RUSTBORO_TORCHIC", "TRAINER_BRENDAN_RUSTBORO_MUDKIP",
    # Dewford Gym.
    "TRAINER_TAKAO", "TRAINER_JOCELYN", "TRAINER_LAURA", "TRAINER_LILITH", "TRAINER_CRISTIAN", "TRAINER_BRENDEN",
    "TRAINER_BRAWLY_1",
    # Route 106 fishermen on the beach; Douglas and Kyla (and all of Route 107) are swimmers: Surf.
    "TRAINER_ELLIOT_1", "TRAINER_NED",
]
maps = ["RusturfTunnel", "DewfordTown*", "Route106", "Route107", "GraniteCave*"]
c_files = []

[mauville]
description = "Briney to Route 109 -> Slateport -> Route 110 -> Mauville, up to Wattson"
# Strict: to_mauville (make check-oddex-full) plays it from Granite Cave to Wattson's badge.
strict = true
# Route 109 and Slateport have only water and fishing tables; fishing is in scope since the Old Rod
# (Dewford). Water tables need Surf. Mauville has no wild table.
wild_maps = ["Route109", "SlateportCity", "Route110"]
wild_kinds = ["land_mons", "fishing_mons"]
# stage_reach.py from the Route 109 dock reaches Route 109's beach, Slateport, all of Route 110
# (over the wooden bridges under the Cycling Road) and Trick House puzzle 1's first room.
trainers = [
    # Route 109 beach and the Seashore House (David, Alice, Gwen, Austina, Carter, Mel & Paul and
    # Elijah are swimmers: Surf).
    "TRAINER_HUEY", "TRAINER_EDMOND", "TRAINER_RICKY_1", "TRAINER_LOLA_1", "TRAINER_HAILEY", "TRAINER_CHANDLER",
    "TRAINER_DWAYNE", "TRAINER_JOHANNA", "TRAINER_SIMON",
    # Aqua grunts in the Oceanic Museum.
    "TRAINER_GRUNT_MUSEUM_1", "TRAINER_GRUNT_MUSEUM_2",
    # The Route 110 rival (one of six parties, by the player's gender and starter). Their starters'
    # stage 2 (Grovyle, Combusken, Marshtomp) are written as the STARTER_*_2 roles ("Oddex Starter
    # Grass 2" ...), like the stage-1 roles in the earlier rival battles.
    "TRAINER_MAY_ROUTE_110_TREECKO", "TRAINER_MAY_ROUTE_110_TORCHIC", "TRAINER_MAY_ROUTE_110_MUDKIP",
    "TRAINER_BRENDAN_ROUTE_110_TREECKO", "TRAINER_BRENDAN_ROUTE_110_TORCHIC", "TRAINER_BRENDAN_ROUTE_110_MUDKIP",
    # Route 110 and the Cycling Road. Edwin's Nuzleaf is Bekurama's stage 2 (Karabeki).
    "TRAINER_ABIGAIL_1", "TRAINER_ALYSSA", "TRAINER_ANTHONY", "TRAINER_BENJAMIN_1", "TRAINER_DALE", "TRAINER_EDWARD",
    "TRAINER_EDWIN_1",
    "TRAINER_ISABEL_1", "TRAINER_JACLYN", "TRAINER_JACOB", "TRAINER_JASMINE", "TRAINER_JOSEPH", "TRAINER_KALEB",
    "TRAINER_TIMMY",
    # Trick House puzzle 1: Sally is reachable; Eddie and Robin need Cut.
    "TRAINER_SALLY",
    # Wally outside the gym, the gym and Wattson.
    "TRAINER_WALLY_MAUVILLE",
    "TRAINER_ANGELO", "TRAINER_BEN", "TRAINER_KIRK", "TRAINER_SHAWN", "TRAINER_VIVIAN", "TRAINER_WATTSON_1",
