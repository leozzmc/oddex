# Plan B migration scopes: which content has moved (or is moving) from vanilla to original species.
# Shared by tools/oddex/apply_replacements.py (--scope NAME: what to rewrite) and
# tools/oddex/check_species_refs.py (--scope NAME: what to report; --strict-scopes: fail on every
# scope with strict = true). `make check-oddex` runs --strict-scopes, so this file is also the
# migration progress table: flip `strict` to true once a scope is migrated.
#
# Fields (all optional):
#   wild_maps     map names (map.json "name") whose wild encounter tables are in scope;
#                 "Map:kind" takes just that table, whatever wild_kinds says
#   wild_kinds    encounter tables to include, e.g. ["land_mons"] (default: all kinds)
#   trainers      explicit TRAINER_* constants; trainers are never inferred from maps
#   partners      explicit PARTNER_* constants: multi-battle partners (src/data/battle_partners.party)
#   maps          map names for scripts, text and Pokemon-shaped map objects; shell-style
#                 wildcards allowed ("LittlerootTown*" includes the town's interiors)
#   exclude_maps  map names/wildcards removed from `maps`
#   exclude_refs  "<file relative to game/>:SPECIES_X" pairs that stay out of scope (both tools skip
#                 them; for src/data/wild_encounters.json that is every slot of the species in scope)
#   c_files       C sources (relative to game/) whose species references must all be migrated
#   script_files  shared event scripts (game/data/scripts/*.inc) used by this stretch; their script
#                 and text references count as in scope (map scripts are covered by `maps`)

[early]
description = "Littleroot -> Petalburg: plan B step 4b"
strict = true
wild_maps = ["Route101", "Route102", "Route103"]
wild_kinds = ["land_mons"]   # water and fishing need a rod or Surf; not reachable this early
trainers = [
    # Route 102. Route 103's other trainers are mid-game (reached from Route 110 or by Surf).
    "TRAINER_CALVIN_1", "TRAINER_RICK", "TRAINER_TIANA", "TRAINER_ALLEN",
    # Route 103 rival; already role aliases (Oddex Starter *) since step 2b.
    "TRAINER_MAY_ROUTE_103_TREECKO", "TRAINER_MAY_ROUTE_103_TORCHIC", "TRAINER_MAY_ROUTE_103_MUDKIP",
    "TRAINER_BRENDAN_ROUTE_103_TREECKO", "TRAINER_BRENDAN_ROUTE_103_TORCHIC", "TRAINER_BRENDAN_ROUTE_103_MUDKIP",
]
maps = ["LittlerootTown*", "Route101", "OldaleTown*", "Route103", "Route102", "PetalburgCity*"]
exclude_refs = [
    # Birch gives a Johto starter after the Hall of Fame; post-game, not part of this scope.
    "data/maps/LittlerootTown_ProfessorBirchsLab/scripts.inc:SPECIES_CHIKORITA",
    "data/maps/LittlerootTown_ProfessorBirchsLab/scripts.inc:SPECIES_CYNDAQUIL",
    "data/maps/LittlerootTown_ProfessorBirchsLab/scripts.inc:SPECIES_TOTODILE",
]
# The story Pokemon of this stretch (intro, rescue, starters, Wally's tutorial) are role aliases
# since steps 2a/2b, so no C file has to be listed here.
c_files = []
# Both Littleroot houses run the shared players' house scripts (movers, Mom, TV).
script_files = ["data/scripts/players_house.inc"]

