[lavaridge]
description = "After Wattson: Route 117/Verdanturf, Route 111-114, Fallarbor, Meteor Falls, Mt. Chimney, Jagged Pass, Lavaridge, up to Flannery"
strict = false
# Reachability: stage_reach.py --rock-smash from Mauville (Rock Smash comes from the Mauville house
# with the Dynamo Badge; no Surf, Cut or Strength, whose HM is usable only with Flannery's badge),
# plus a second run from the Mt. Chimney cable car station (the cable car is a scripted warp the BFS
# cannot see; Jagged Pass leads down to Lavaridge). Route 111's desert needs the Go-Goggles (given in
# Lavaridge after Flannery): its entrances are the ViciousSandstorm triggers, so the reach was
# checked with those tiles blocked. Story locks judged by hand: the Route 112 Magma grunts and the
# cable car open after Meteor Falls, which is still this segment.
#
# Wild tables: only kinds with a reachable tile. Route 111's land encounters are all on the desert
# sand, so it is in for fishing (a pond by the path) and Rock Smash only; Route 115 and Route 118 are
# reached on foot at the shore only (fishing). water_mons needs Surf. Granite Cave B2F's Rock Smash
# rocks are reachable since Dewford once Rock Smash is usable.
wild_maps = ["Route112", "Route113", "Route114", "Route117", "FieryPath", "JaggedPass", "MeteorFalls_1F_1R",
             "Route111:fishing_mons", "Route111:rock_smash_mons", "Route115:fishing_mons", "Route118:fishing_mons",
             "GraniteCave_B2F:rock_smash_mons"]
