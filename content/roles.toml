# Story/gameplay roles -> species. Generates game/include/constants/oddex_species.h:
#   STARTER_GRASS = "TREECKO"  ->  #define SPECIES_ODDEX_STARTER_GRASS SPECIES_TREECKO
# Code, scripts, trainers.party ("Oddex Starter Grass") and wild_encounters.json refer to
# SPECIES_ODDEX_<ROLE>, so recasting a role only touches this file.
# A value may be an original species id (content/species/*.toml) or a vanilla one.
# Since plan B step 4b every role points at an original (except where a comment says why); each
# follows the vanilla species it replaced in content/replacements.toml (vanilla name in the comment).

# Route 101 starter choice; also the Route 103 rival and Petalburg PC type talk.
STARTER_GRASS = "GRINPACK"      # Treecko (the trio, docs/research/friends-designs.md)
STARTER_FIRE = "TREKKEYE"       # Torchic
STARTER_WATER = "RIDGECAP"      # Mudkip
# Their second stages, for the rival's teams from Route 110 on.
STARTER_GRASS_2 = "GRINVINE"    # Grovyle
STARTER_FIRE_2 = "TREKWHEEL"    # Combusken
STARTER_WATER_2 = "RIDGEFIN"    # Marshtomp
# Their third stages, for the rival's last teams.
STARTER_GRASS_3 = "GRINARBOR"   # Sceptile
STARTER_FIRE_3 = "TREKCART"     # Blaziken
STARTER_WATER_3 = "RIDGELOOM"   # Swampert

# Pokemon Birch shows during the new-game intro (src/main_menu.c).
INTRO_MON = "SHOJOBOB"          # Lotad

# Wild Pokemon chasing Birch on Route 101, the player's first battle (src/battle_controllers.c).
RESCUE_WILD = "KYOKON"          # Zigzagoon

# Wally's catching tutorial in Petalburg: the target (src/battle_setup.c) and the Pokemon
# lent to Wally (src/field_specials.c).
TUTORIAL_CATCH = "OMOTELLE"     # Ralts
TUTORIAL_LENT = "KYOKON"        # Zigzagoon
# Mr. Briney's Peeko: Briney's house (Route 104) and the Aqua grunt's hostage in Rusturf Tunnel
# (cries and overworld sprites).
PEEKO = "UTOGHAST"              # Wingull

# The pet in a Rustboro City house (RustboroCity_House3: cry, text and object graphic; was Pikachu).
RUSTBORO_PET = "INARIZUMA"

# Lavaridge: the old lady's EGG (giveegg; Wynaut in vanilla): Gachirinza, the moon sitter meditating by the hot spring.
EGG_GIFT = "GACHIRINZA"             # Wynaut
